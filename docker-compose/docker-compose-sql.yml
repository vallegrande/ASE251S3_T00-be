services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "AdminSQL2024"
    ports:
      - "1444:1433"
    networks:
      - red_proyectos
    volumes:
      - sql_data:/var/opt/mssql

networks:
  red_proyectos:
    external: true

volumes:
  sql_data: