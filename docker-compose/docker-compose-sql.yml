services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "AdminSQL2024"
    ports:
      - "1444:1433"       # acceso local: localhost:1444
    networks:
      - red_proyectos
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P AdminSQL2024 -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  red_proyectos:
    external: true

volumes:
  sql_data: