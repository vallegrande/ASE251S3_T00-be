spring:
  datasource:
    # Docker SQL Server
    url: jdbc:sqlserver://sqlserver:1433;databaseName=ConstruccionDB;encrypt=true;trustServerCertificate=true
    username: sa
    password: AdminSQL2024

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# Swagger UI
springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
    enabled: true