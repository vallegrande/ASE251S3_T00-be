spring:
  datasource:
    # Docker SQL Server (nombre del servicio en la red docker)
    url: jdbc:sqlserver://sqlserver:1433;databaseName=ConstruccionDB;encrypt=true;trustServerCertificate=true
    username: sa
    password: AdminSQL2024
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: none          # usamos script_db.sql manual, no auto-generación
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true      # SQL formateado en consola

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Para pruebas locales sin Docker, usa el perfil "local":
#   java -jar app.jar --spring.profiles.active=local
# O crea src/main/resources/application-local.yaml con:
#   spring.datasource.url: jdbc:sqlserver://localhost:1444;...