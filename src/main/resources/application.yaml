spring:
  datasource:
    # Cambiamos localhost por el nombre del servicio de la DB en Docker
    # Usamos 1433 porque es la comunicación interna entre contenedores
    url: jdbc:sqlserver://sqlserver:1433;databaseName=ConstruccionDB;encrypt=true;trustServerCertificate=true
